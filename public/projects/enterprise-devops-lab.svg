<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <rect width="800" height="500" rx="16" fill="#0B0F19"/>
  <rect x="1" y="1" width="798" height="498" rx="15" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Window Header -->
  <rect x="0" y="0" width="800" height="44" rx="16" fill="#131B2E"/>
  <circle cx="28" cy="22" r="6" fill="#EF4444" opacity="0.8"/>
  <circle cx="48" cy="22" r="6" fill="#F59E0B" opacity="0.8"/>
  <circle cx="68" cy="22" r="6" fill="#10B981" opacity="0.8"/>
  <text x="400" y="27" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">proxmox-node-01.local — Private Cloud Cluster</text>
  
  <!-- Sidebar -->
  <rect x="24" y="64" width="180" height="412" rx="10" fill="#162035" stroke="rgba(255,255,255,0.05)"/>
  <rect x="40" y="84" width="148" height="28" rx="6" fill="#6366F1" fill-opacity="0.2"/>
  <text x="56" y="103" fill="#818CF8" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">● Proxmox VE</text>
  <text x="56" y="145" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="13">Storage (TrueNAS)</text>
  <text x="56" y="185" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="13">Containers (Docker)</text>
  <text x="56" y="225" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="13">Network (Tailscale)</text>
  <text x="56" y="265" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="13">CI/CD Pipelines</text>
  
  <!-- Main Cards -->
  <!-- Status Card 1 -->
  <rect x="224" y="64" width="260" height="120" rx="10" fill="#162035" stroke="rgba(255,255,255,0.05)"/>
  <text x="244" y="92" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">CLUSTER STATUS</text>
  <text x="244" y="128" fill="#10B981" font-family="-apple-system, sans-serif" font-size="24" font-weight="700">Healthy (100%)</text>
  <text x="244" y="156" fill="#64748B" font-family="-apple-system, sans-serif" font-size="12">8 Microservices Online</text>

  <!-- Status Card 2 -->
  <rect x="504" y="64" width="272" height="120" rx="10" fill="#162035" stroke="rgba(255,255,255,0.05)"/>
  <text x="524" y="92" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">ZFS STORAGE (RAID 1)</text>
  <text x="524" y="128" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="24" font-weight="700">TrueNAS SCALE</text>
  <text x="524" y="156" fill="#64748B" font-family="-apple-system, sans-serif" font-size="12">Redundant Disk Pool Active</text>
  
  <!-- Terminal / Service List -->
  <rect x="224" y="204" width="552" height="272" rx="10" fill="#0E1626" stroke="rgba(255,255,255,0.06)"/>
  <text x="244" y="234" fill="#818CF8" font-family="monospace" font-size="13">$ docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"</text>
  
  <rect x="244" y="254" width="512" height="36" rx="6" fill="#162238"/>
  <text x="256" y="277" fill="#F8FAFC" font-family="monospace" font-size="12">nginx-reverse-proxy</text>
  <text x="440" y="277" fill="#10B981" font-family="monospace" font-size="12">Up 42 days (SSL)</text>
  <text x="620" y="277" fill="#94A3B8" font-family="monospace" font-size="12">0.0.0.0:443->443</text>

  <rect x="244" y="298" width="512" height="36" rx="6" fill="#162238" fill-opacity="0.6"/>
  <text x="256" y="321" fill="#F8FAFC" font-family="monospace" font-size="12">nextcloud-core</text>
  <text x="440" y="321" fill="#10B981" font-family="monospace" font-size="12">Up 42 days</text>
  <text x="620" y="321" fill="#94A3B8" font-family="monospace" font-size="12">127.0.0.1:8080</text>

  <rect x="244" y="342" width="512" height="36" rx="6" fill="#162238"/>
  <text x="256" y="365" fill="#F8FAFC" font-family="monospace" font-size="12">pihole-dns-sinkhole</text>
  <text x="440" y="365" fill="#10B981" font-family="monospace" font-size="12">Up 38 days</text>
  <text x="620" y="365" fill="#94A3B8" font-family="monospace" font-size="12">0.0.0.0:53->53</text>

  <rect x="244" y="386" width="512" height="36" rx="6" fill="#162238" fill-opacity="0.6"/>
  <text x="256" y="409" fill="#F8FAFC" font-family="monospace" font-size="12">n8n-automation-engine</text>
  <text x="440" y="409" fill="#10B981" font-family="monospace" font-size="12">Up 24 days</text>
  <text x="620" y="409" fill="#94A3B8" font-family="monospace" font-size="12">127.0.0.1:5678</text>

  <rect x="244" y="430" width="512" height="32" rx="6" fill="#6366F1" fill-opacity="0.15" stroke="rgba(99,102,241,0.3)"/>
  <text x="256" y="451" fill="#A5B4FC" font-family="monospace" font-size="12">CI/CD: GitHub Actions -> Azure/AWS deployment active</text>
