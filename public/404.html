<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>404 - Page Not Found | Janeesha Gamage</title>
    <meta
      name="description"
      content="The page you are looking for does not exist."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #0b0f19;
        color: #e2e8f0;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        padding: 1.5rem;
        line-height: 1.6;
      }
      .card {
        max-width: 480px;
        width: 100%;
        padding: 2.5rem 2rem;
        border-radius: 1.5rem;
        background: rgba(26, 31, 54, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        text-align: center;
        backdrop-filter: blur(12px);
      }
      .badge {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        background: rgba(124, 106, 255, 0.15);
        color: #9d8cff;
        border: 1px solid rgba(124, 106, 255, 0.3);
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 3.5rem;
        font-weight: 800;
        line-height: 1;
        margin-bottom: 0.75rem;
        color: #ffffff;
      }
      h2 {
        font-size: 1.25rem;
        font-weight: 600;
        color: #cbd5e1;
        margin-bottom: 0.75rem;
      }
      p {
        font-size: 0.95rem;
        color: #94a3b8;
        margin-bottom: 2rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.75rem 1.75rem;
        border-radius: 9999px;
        background: #7c6aff;
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
        box-shadow: 0 4px 14px rgba(124, 106, 255, 0.3);
        transition: all 0.2s ease;
      }
      .btn:hover {
        background: #6c57f5;
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(124, 106, 255, 0.4);
      }
      .btn:focus-visible {
        outline: 2px solid #ffffff;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="badge">404 Error</span>
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>
        The page you are looking for doesn't exist, has been removed, or has had its name changed.
      </p>
      <a href="/" class="btn">
        <span>Return to Homepage</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>
    </main>
  </body>
</html>
